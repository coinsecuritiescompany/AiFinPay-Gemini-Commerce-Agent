name: Feature request
description: Propose a scoped improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: dropdown
    id: financial
    attributes:
      label: Does this affect a financial path?
      options:
        - "No"
        - "Yes"
        - "Unknown"
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Required controls and evidence
      description: Include authorization, limits, idempotency, audit, and testing considerations.
