name: npm package check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Validate install and tests
        run: |
          npm ci
          npm run check
          npm run build
      - name: Inspect package tarball
        run: npm pack --dry-run
      - name: Check whether package already exists
        shell: bash
        run: |
          if npm view @aifinpay/gemini-commerce-agent version >/tmp/npm-version 2>/dev/null; then
            echo "PACKAGE_EXISTS=true"
            cat /tmp/npm-version
          else
            echo "PACKAGE_EXISTS=false"
          fi
