name: Prepare branding v0.2.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare branding release 0.2.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Update README and package version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('src="docs/assets/hero.svg"', 'src="docs/assets/hero.svg?v=20260810"', 1)
          s=s.replace('The current suite contains 15 tests', 'The current suite contains 20 tests')
          p.write_text(s)
          PY
          npm version 0.2.1 --no-git-tag-version
          npm ci
          npm run check
          npm run build
          npm pack --dry-run
      - name: Commit branding release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md package.json package-lock.json
          git commit -m 'Release npm 0.2.1: refresh hero branding [skip ci]'
          git push
