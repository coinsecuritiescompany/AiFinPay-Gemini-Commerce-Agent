name: Repair npm10 lockfile for v0.3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair npm10 lockfile for v0.3 CLI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Rebuild npm 10 lock metadata and validate
        run: |
          npm --version
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build
      - name: Commit lockfile if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already compatible.'
            exit 0
          fi
          git commit -m 'Sync package lock for npm 10 and Node 22 [skip ci]'
          git push
