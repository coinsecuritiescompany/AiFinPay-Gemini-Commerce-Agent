name: Prepare v0.2.0 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Prepare npm 0.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Synchronize documentation and lockfile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          marker = '## Why this exists\n'
          section = '''## v0.2 — autonomous procurement beyond text\n\nThe v0.2 capability layer turns the agent from a linear JSON buyer into a bounded procurement operator:\n\n- **Multimodal procurement** — submit a server-part photo, product image, invoice, chart, or analytics screenshot. Gemini extracts procurement-relevant facts and produces a merchant-search query; raw image bytes are not persisted.\n- **Dynamic negotiation** — when a merchant exposes a negotiation endpoint and policy explicitly permits it, Gemini may propose a counter-offer. Deterministic rules cap the discount, enforce the budget and allowlists, and re-validate the agreed offer before payment.\n- **Self-healing payments** — transient gas/RPC/network failures are classified and retried within a fixed attempt budget. Alternative network/asset paths are used only when supplied in the offer and independently permitted by `allowedNetworks`, `allowedAssets`, and recovery policy.\n\nSee [ADVANCED_COMMERCE.md](ADVANCED_COMMERCE.md) for request contracts, trust boundaries, negotiation rules, recovery semantics, and evidence limitations.\n\n'''
          if section not in text and marker in text:
              text = text.replace(marker, section + marker, 1)

          text = text.replace('The current suite contains 13 tests', 'The current suite contains 20 tests')
          text = text.replace('├── gemini.ts             structured Gemini decision engine\n', '├── gemini.ts             structured Gemini decision engine\n    ├── vision.ts             Gemini multimodal procurement inspection\n    ├── merchant-discovery.ts configured merchant catalog search\n    ├── negotiation.ts        bounded counter-offer exchange\n    ├── recovery.ts           deterministic retry and network/asset failover\n')
          api_row = '| `POST` | `/v1/visual-objectives` | Admin token | Image → Gemini inspection → merchant offers → optional objective execution |\n'
          anchor = '| `POST` | `/v1/objectives` | Admin token | Create objective |\n'
          if api_row not in text and anchor in text:
              text = text.replace(anchor, api_row + anchor, 1)
          doc_row = '| [Advanced commerce](ADVANCED_COMMERCE.md) | Multimodal procurement, negotiation and self-healing payment execution |\n'
          doc_anchor = '| [Architecture](ARCHITECTURE.md) | Components, trust boundaries, flows, state, deployment and data model |\n'
          if doc_row not in text and doc_anchor in text:
              text = text.replace(doc_anchor, doc_anchor + doc_row, 1)
          env_note = 'Optional merchant catalog discovery uses `MERCHANT_API_ENDPOINTS` (comma-separated HTTPS base URLs exposing `POST /search`).\n\n'
          install_anchor = 'Live Gemini calls require `GEMINI_API_KEY`. Production financial execution additionally requires an `ADMIN_TOKEN` and an AiFinPay agent seed; never commit these values.\n\n'
          if env_note not in text and install_anchor in text:
              text = text.replace(install_anchor, install_anchor + env_note, 1)
          readme.write_text(text)

          arch = Path('ARCHITECTURE.md')
          a = arch.read_text()
          add = '''\n## v0.2 advanced commerce layer\n\nThe core trust model now includes three optional capability stages before/around settlement:\n\n1. `GeminiVisionEngine` converts image input into structured procurement facts; raw image bytes are not stored.\n2. `MerchantDiscoveryService` queries only operator-configured merchant catalog endpoints and validates returned offers against the same offer schema.\n3. `NegotiationService` and `executeWithRecovery` add bounded counter-offers plus transient-failure recovery. Every negotiated or recovery candidate is re-checked by deterministic spending policy before AiFinPay receives it.\n\nThe AI layer never receives signing credentials and cannot expand merchant/network/asset allowlists. See [ADVANCED_COMMERCE.md](ADVANCED_COMMERCE.md) for the complete contracts and threat boundaries.\n'''
          if '## v0.2 advanced commerce layer' not in a:
              arch.write_text(a.rstrip() + '\n' + add)

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text() if changelog.exists() else '# Changelog\n'
          entry = '''\n## 0.2.0 — 2026-08-10\n\n- Added Gemini-native multimodal procurement via `POST /v1/visual-objectives`.\n- Added configured merchant API discovery with validated offer ingestion.\n- Added bounded `NEGOTIATE` decisions and deterministic counter-offer policy.\n- Added merchant negotiation contract with same-origin payment URL enforcement.\n- Added deterministic self-healing classification, retry/backoff and allowlisted recovery paths.\n- Added settlement-price mismatch protection for negotiated offers.\n- Added recovery/negotiation evidence records and production health capability reporting.\n- Added advanced tests for negotiation bounds, image-to-objective conversion, raw-image non-persistence and Polygon→Base recovery simulation.\n'''
          if '## 0.2.0 — 2026-08-10' not in c:
              if c.startswith('# Changelog'):
                  lines = c.splitlines(True)
                  c = lines[0] + entry + ''.join(lines[1:])
              else:
                  c = '# Changelog\n' + entry + '\n' + c
              changelog.write_text(c)

          disclosure = Path('HACKATHON_DISCLOSURE.md')
          d = disclosure.read_text()
          advanced = '''\n### v0.2 hackathon additions\n\n- Gemini-native image understanding for procurement objectives.\n- Merchant catalog discovery adapter for operator-configured APIs.\n- Dynamic negotiation decision and bounded counter-offer policy.\n- Merchant negotiation exchange with agreed-price re-validation.\n- Self-healing payment execution for classified transient Web3/RPC failures.\n- Allowlisted recovery-path validation and recovery evidence records.\n\nThese modules were created for the hackathon project. They build on the disclosed pre-existing AiFinPay SDK/AIFP settlement infrastructure. Code/tests do not imply a real external merchant negotiation or cross-network recovery until separately evidenced.\n'''
          if '### v0.2 hackathon additions' not in d:
              disclosure.write_text(d.rstrip() + '\n' + advanced)

          evidence = Path('EVIDENCE.md')
          e = evidence.read_text()
          ev = '''\n## v0.2 advanced-capability code evidence\n\nAutomated code/test evidence now covers multimodal objective construction without raw-image persistence, deterministic negotiation bounds, transient failure classification, and allowlisted recovery failover. This is implementation evidence only. A real multimodal settled purchase, external merchant negotiation, or real cross-network recovery must not be claimed until a production trace plus corresponding merchant/payment evidence exists.\n'''
          if '## v0.2 advanced-capability code evidence' not in e:
              evidence.write_text(e.rstrip() + '\n' + ev)
          PY

          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build
          npm pack --dry-run

      - name: Commit prepared release files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ARCHITECTURE.md CHANGELOG.md HACKATHON_DISCLOSURE.md EVIDENCE.md package-lock.json
          if git diff --cached --quiet; then
            echo 'Release files already synchronized.'
            exit 0
          fi
          git commit -m 'Finalize v0.2.0 documentation and lockfile [skip ci]'
          git push
