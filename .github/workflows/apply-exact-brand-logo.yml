name: Apply exact AiFinPay frontend logo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply exact AiFinPay frontend logo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Embed exact brand mark and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          logo = ''
          p = Path('src/dashboard.ts')
          s = p.read_text()
          s = re.sub(r'<span class="brand-mark" aria-hidden="true">.*?</span>', '<span class="brand-mark"><img src="data:image/webp;base64,' + logo + '" alt="AiFinPay logo" /></span>', s, count=1, flags=re.S)
          s = s.replace('.brand-mark svg { width: 38px; height: 38px; }', '.brand-mark img { width: 100%; height: 100%; border-radius: 13px; object-fit: cover; display: block; }')
          s = s.replace('.brand-mark svg { width: 34px; height: 34px; }', '.brand-mark img { width: 100%; height: 100%; border-radius: 13px; object-fit: cover; display: block; }')
          p.write_text(s)

          app = Path('src/app.ts')
          a = app.read_text()
          a = a.replace("default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'", "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'")
          app.write_text(a)
          PY
          npm ci
          npm run check
          npm run build
      - name: Commit exact brand mark
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard.ts src/app.ts
          git commit -m 'Use exact AiFinPay logo in production dashboard [skip ci]'
          git push
