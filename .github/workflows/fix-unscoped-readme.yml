name: Sync unscoped npm README

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update npm package references
        run: |
          sed -i 's#@aifinpay/gemini-commerce-agent#aifinpay-gemini-commerce-agent#g; s#13 tests#15 tests#g' README.md
          if git diff --quiet -- README.md; then
            echo 'README already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Sync README with unscoped npm package [skip ci]'
          git push
