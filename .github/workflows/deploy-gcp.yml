name: Deploy to Google Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: aifinpau
  REGION: us-central1
  SERVICE: aifinpay-gemini-commerce-agent
  AR_REPOSITORY: aifinpay

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          docker build --pull -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push image
        run: docker push "$IMAGE"

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --image="$IMAGE" \
            --service-account="${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=20 \
            --timeout=300 \
            --set-env-vars="NODE_ENV=production,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-2.5-flash,FIRESTORE_ENABLED=true,FIRESTORE_DATABASE_ID=(default),AIFINPAY_API_BASE_URL=https://api.aifinpay.io,AIFINPAY_GATEWAY_ORIGINS=https://gateway.aifinpay.io,AIFINPAY_DAILY_BUDGET_USD=1,AIFINPAY_PER_CALL_BUDGET_USD=0.05,CIRCLE_BLOCKCHAIN=ARC-TESTNET,CIRCLE_MAX_TRANSFER_USD=1" \
            --set-secrets="ADMIN_TOKEN=aifinpay-admin-token:latest,AIFINPAY_AGENT_SEED_HEX=aifinpay-agent-seed:latest"

      - name: Verify production health
        shell: bash
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          printf '### Production deployment\n\n- URL: %s\n- Image: `%s`\n\n' "$SERVICE_URL" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$SERVICE_URL/health" -o health.json; then
              cat health.json
              printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
              cat health.json >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done

          echo "Cloud Run health check did not become ready" >&2
          exit 1
