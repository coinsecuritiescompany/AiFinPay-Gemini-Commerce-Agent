name: Inspect AiFinPay agent SDK API

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect x402 facilitator and fetchPaid declarations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show relevant type declarations
        shell: bash
        run: |
          echo '--- unifiedAgent fetchPaid ---'
          sed -n '500,565p' node_modules/@aifinpay/agent/dist/unifiedAgent.d.ts
          echo '--- standard x402 facilitator ---'
          cat node_modules/@aifinpay/agent/dist/facilitators/standard-x402.d.ts
          echo '--- facilitator detection ---'
          cat node_modules/@aifinpay/agent/dist/facilitators/detect.d.ts
          echo '--- facilitator exports ---'
          cat node_modules/@aifinpay/agent/dist/facilitators/index.d.ts
          echo '--- aifp1 fetch options ---'
          grep -n -A80 -B10 'interface Aifp1FetchOptions\|type Aifp1FetchOptions' node_modules/@aifinpay/agent/dist/aifp1.d.ts
