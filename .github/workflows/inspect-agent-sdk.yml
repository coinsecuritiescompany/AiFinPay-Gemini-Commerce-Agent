name: Inspect AiFinPay agent SDK API

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect generic x402 Agent API'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show Agent and unified methods
        shell: bash
        run: |
          echo '--- agent.d.ts ---'
          cat node_modules/@aifinpay/agent/dist/agent.d.ts
          echo '--- unified public methods ---'
          sed -n '229,535p' node_modules/@aifinpay/agent/dist/unifiedAgent.d.ts
          echo '--- facilitator base ---'
          cat node_modules/@aifinpay/agent/dist/facilitators/base.d.ts
