name: Prepare v0.3 self-serve x402 release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'Run v0.3 preparation from script'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Apply v0.3 changes
        run: python3 scripts/prepare-v030.py
      - name: Set version and validate
        run: |
          npm version 0.3.0 --no-git-tag-version
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check
          npm run build
          npm pack --dry-run
      - name: Commit v0.3 release prep
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dashboard.ts src/app.ts README.md ARCHITECTURE.md ADVANCED_COMMERCE.md HACKATHON_DISCLOSURE.md CHANGELOG.md package.json package-lock.json
          git commit -m 'Release v0.3.0: self-serve wallets and universal x402 [skip ci]'
          git push
