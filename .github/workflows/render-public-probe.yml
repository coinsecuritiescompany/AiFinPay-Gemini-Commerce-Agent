name: Render public probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe AiFinPay public status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://aifinpay-gemini-commerce-agent.onrender.com/v1/aifinpay/status \
            | python -m json.tool
