name: Sync dashboard runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'Prepare dashboard runtime sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Sync runtime version and validate dashboard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app.ts')
          s = p.read_text()
          s = s.replace('version: "0.2.0"', 'version: "0.2.1"', 1)
          p.write_text(s)
          PY
          npm ci
          npm run check
          npm run build
      - name: Commit runtime sync
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.ts
          if git diff --cached --quiet; then
            echo 'Already synced.'
            exit 0
          fi
          git commit -m 'Sync dashboard runtime version to 0.2.1 [skip ci]'
          git push
