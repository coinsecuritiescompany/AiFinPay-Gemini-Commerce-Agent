name: Probe v0.2.0 production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: github.event.head_commit.message == 'Probe v0.2.0 production'
    runs-on: ubuntu-latest
    steps:
      - name: Verify production health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://aifinpay-gemini-commerce-agent.onrender.com/health \
            -o /tmp/health.json
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||h.version!=='0.2.0') process.exit(1); const required=['multimodal-procurement','dynamic-negotiation','self-healing-payments']; if(!required.every(x=>h.capabilities?.includes(x))) process.exit(2); console.log('PRODUCTION_V020_OK')"
