<text x="270" y="92" fill="#F8FBFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="44" font-weight="800">AiFinPay</text>
<text x="270" y="126" fill="#559BFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.7">AI AGENT PAYMENT PROTOCOL</text>
