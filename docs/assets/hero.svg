    <text x="77" y="35" text-anchor="middle" fill="#8eb9ff" font-size="14" font-weight="700">GEMINI</text>
    <text x="77" y="57" text-anchor="middle" fill="#ddecf7" font-size="12">proposes</text>

    <path d="M164 41h42" stroke="#4aa8ff" stroke-width="3"/>
    <path d="m199 34 9 7-9 7" fill="none" stroke="#4aa8ff" stroke-width="3"/>

