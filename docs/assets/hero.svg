    <path d="M19 42V22h8.2l5.1 9.2 5.3-9.2H46v20h-7V32.8l-4.2 7.1h-5l-3.9-7V42z" fill="#07111f"/>
    <text x="82" y="27" fill="#f7fbff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="0.4">AiFinPay</text>
    <text x="82" y="53" fill="#8fb3ca" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="2.2">AGENT ECONOMY INFRASTRUCTURE</text>
