<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">AiFinPay Gemini Commerce Agent</title>
<desc id="desc">Gemini decides. Deterministic policy authorizes. AiFinPay pays.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030817"/><stop offset="0.5" stop-color="#071A38"/><stop offset="1" stop-color="#09152D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#398CFF"/><stop offset="0.45" stop-color="#68A7FF"/><stop offset="1" stop-color="#9D63FF"/></linearGradient>
  <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4FA4FF"/><stop offset="1" stop-color="#8A67FF"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2EE6B8"/><stop offset="1" stop-color="#1D9D7E"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/></filter>
</defs>
