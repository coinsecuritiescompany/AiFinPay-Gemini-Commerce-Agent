    <circle cx="217" cy="19" r="6" fill="#4aa8ff"/>
    <text x="233" y="24" fill="#b9cfdd" font-size="13">Atomic execution</text>
    <rect x="386" width="204" height="38" rx="19" fill="#0d2738" stroke="#234e66"/>
    <circle cx="409" cy="19" r="6" fill="#9b7cff"/>
