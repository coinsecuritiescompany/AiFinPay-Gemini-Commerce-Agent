    <text x="295" y="35" text-anchor="middle" fill="#68e3c4" font-size="14" font-weight="700">POLICY</text>
    <text x="295" y="57" text-anchor="middle" fill="#ddecf7" font-size="12">authorizes</text>

    <path d="M382 41h42" stroke="#32d6b0" stroke-width="3"/>
    <path d="m417 34 9 7-9 7" fill="none" stroke="#32d6b0" stroke-width="3"/>

