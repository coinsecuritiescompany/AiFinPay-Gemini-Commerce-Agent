<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
  <title id="title">AiFinPay Gemini Commerce Agent</title>
  <desc id="desc">Policy-controlled payments for autonomous agents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b2035"/>
      <stop offset="1" stop-color="#10293f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32d6b0"/>
      <stop offset="0.5" stop-color="#4aa8ff"/>
      <stop offset="1" stop-color="#9b7cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#42c7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#42c7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1440" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1220" cy="100" r="310" fill="url(#glow)"/>
  <circle cx="190" cy="440" r="270" fill="url(#glow)" opacity="0.5"/>
  <path d="M0 404 C300 330 430 500 760 410 S1200 350 1440 420 V480 H0Z" fill="#081725" opacity="0.8"/>

