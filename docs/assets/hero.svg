    <text y="119" fill="#b8cddd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Policy-controlled payments for autonomous agents</text>
    <text y="157" fill="#7f9bae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Gemini decides  ·  deterministic policy authorizes  ·  AiFinPay pays</text>
  </g>

  <g transform="translate(840 186)" filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
